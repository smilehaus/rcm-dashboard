name: RCM Help Agent

# Triggered by Cloudflare Worker when a new error report task is created
# in ClickUp list 901417208736 (RCM Help Queue).

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'ClickUp task ID to fix'
        required: true
      error_type:
        description: 'Error type from the report'
        required: false
        default: 'Unknown'

permissions:
  contents: write
  actions: write

jobs:
  fix:
    name: Fix Error Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Configure git
        run: |
          git config user.name "rcm-help-agent[bot]"
          git config user.email "rcm-help-agent[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/smilehaus/rcm-dashboard.git

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Run RCM Help Agent
        run: |
          TASK_ID="${{ github.event.inputs.task_id }}"
          ERROR_TYPE="${{ github.event.inputs.error_type }}"
          claude --print --dangerously-skip-permissions "Read .claude/agents/rcm-help.md for your full instructions. Then fix ClickUp task ${TASK_ID} - error type is ${ERROR_TYPE}. Use CLICKUP_API_TOKEN env var for ClickUp auth. After fixing, post a comment on the task and update status to complete."
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
