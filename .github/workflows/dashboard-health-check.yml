name: RCM Dashboard — Health Check

# Runs Tuesday + Friday at ~10 AM CT (15:37 UTC).
# Also fires on every push to master so every deploy is auto-verified,
# and can be triggered manually from the Actions tab at any time.
#
# On failure: sends an email to saomongmo@gmail.com with the failing
# step and a direct link to the Actions run log.
#
# One-time setup required:
#   1. Go to https://myaccount.google.com/apppasswords
#   2. Create an App Password for "GitHub Actions"
#   3. In smilehaus/rcm-dashboard → Settings → Secrets → Actions:
#      Add secret  GMAIL_APP_PASSWORD = <the 16-char app password>

on:
  schedule:
    - cron: '37 15 * * 2,5'
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  health-check:
    name: Fetch & audit dashboard HTML
    runs-on: ubuntu-latest

    steps:
      # ── 1. Fetch live page ───────────────────────────────────────────────
      - name: Fetch live dashboard
        run: |
          URL="https://smilehaus.github.io/rcm-dashboard/index.html?t=$(date +%s)"
          echo "Fetching: $URL"
          HTTP_STATUS=$(curl -s -o /tmp/dashboard.html -w "%{http_code}" "$URL")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ FAIL — HTTP $HTTP_STATUS (expected 200)"
            exit 1
          fi

          FILE_SIZE=$(wc -c < /tmp/dashboard.html)
          echo "✅ HTTP 200 — ${FILE_SIZE} bytes"

          if [ "$FILE_SIZE" -lt 50000 ]; then
            echo "❌ FAIL — Page is only ${FILE_SIZE} bytes (threshold: 50000)"
            echo "   The page is likely blank or severely broken."
            exit 1
          fi
          echo "✅ File size OK: ${FILE_SIZE} bytes"

      # ── 2. Structural landmarks ──────────────────────────────────────────
      - name: Check structural landmarks
        run: |
          FAIL=0
          check() {
            local pattern="$1"
            local label="$2"
            if grep -qF "$pattern" /tmp/dashboard.html; then
              echo "  ✅  $label"
            else
              echo "  ❌  MISSING: $label"
              FAIL=1
            fi
          }

          echo "── Structural landmarks ────────────────────────────────"
          check "arsnap-cards"                 "arsnap-cards section"
          check "live-board"                   "live-board section"
          check "arsnap-history-modal"         "per-office history modal"
          check "arsnap-orgwide-history-modal" "org-wide history modal"
          check "renderOfficeRowGroup"         "renderOfficeRowGroup()"
          check "renderPerOfficeHistory"       "renderPerOfficeHistory()"
          check "normalizeSArrays"             "normalizeSArrays()"
          check "mergeBoardState"              "mergeBoardState()"
          check "startFbPolling"               "startFbPolling()"
          check "unpostedWeekArrowsHtml"       "two-arrow posting indicator"

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::One or more structural sections are missing from the live dashboard."
            exit 1
          fi

      # ── 3. Token-safety guards ───────────────────────────────────────────
      # These exact patterns protect live-board tokens from being silently
      # deleted when Firebase RTDB strips empty array/object nodes from its tree.
      - name: Check token-safety guards
        run: |
          FAIL=0
          guard() {
            local pattern="$1"
            local label="$2"
            local note="$3"
            if grep -qF "$pattern" /tmp/dashboard.html; then
              echo "  ✅  $label"
            else
              echo "  ❌  MISSING: $label"
              echo "       ↳ Risk: $note"
              FAIL=1
            fi
          }

          echo "── Token-safety guards ──────────────────────────────────"
          guard "PROTECTED_KEYS" \
            "PROTECTED_KEYS set defined" \
            "delete S[k] loop has no guard — ANY key Firebase strips will vanish from S"

          guard "PROTECTED_KEYS.has(k)" \
            "PROTECTED_KEYS.has(k) guard in poll merge loop" \
            "S.live / S.assign will be deleted when Firebase returns empty board state"

          guard "S.live[o.code]" \
            "S.live[o.code] restoration in normalizeSArrays" \
            "Live token cells won't be rebuilt after a Firebase empty-node strip"

          guard "S.assign[o.code]" \
            "S.assign[o.code] restoration in normalizeSArrays" \
            "Assignment rows may disappear if Firebase strips empty assign arrays"

          guard "Array.isArray(inst.helpers)" \
            "Array.isArray(inst.helpers) guard in provideHelp/addOutsideHelper" \
            "Save crash when a help instance has no helpers array"

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::One or more token-safety guards are missing. Live-board tokens WILL be silently removed on the next Firebase poll."
            exit 1
          fi

      # ── 4. Regression check ──────────────────────────────────────────────
      - name: Check for dangerous regressions
        run: |
          FAIL=0

          if grep -qF "PROTECTED_KEYS.has(k)" /tmp/dashboard.html; then
            echo "  ✅  Delete loop is guarded by PROTECTED_KEYS"
          else
            if grep -qF "if (!(k in merged)) delete S[k]" /tmp/dashboard.html; then
              echo "  ❌  REGRESSION: bare delete S[k] found WITHOUT PROTECTED_KEYS guard"
              echo "       ↳ Tokens will wipe within one Firebase poll cycle (15 s)"
              FAIL=1
            else
              echo "  ⚠️   Neither guard nor bare delete found — review index.html manually"
            fi
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Dangerous regression: unguarded delete loop detected."
            exit 1
          fi

      # ── 5. Summary ───────────────────────────────────────────────────────
      - name: Health check summary
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "✅  RCM Dashboard — all checks PASSED"
          echo "    URL  : https://smilehaus.github.io/rcm-dashboard/"
          echo "    Time : $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "════════════════════════════════════════"

  # ══════════════════════════════════════════════════════════════════════════
  # Email saomongmo@gmail.com when ANY step above fails.
  # Uses Gmail SMTP with an App Password stored in repo secrets.
  notify-failure:
    name: Email failure alert
    runs-on: ubuntu-latest
    needs: health-check
    if: failure()

    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: saomongmo@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: saomongmo@gmail.com
          from: "RCM Dashboard Monitor <saomongmo@gmail.com>"
          subject: "❌ RCM Dashboard health check FAILED — ${{ github.run_id }}"
          body: |
            The RCM Dashboard health check failed.

            Trigger : ${{ github.event_name }}
            Branch  : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
            Time    : ${{ github.event.head_commit.timestamp }}

            View the full log (including which check failed and why):
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Common causes:
            - Structural section wiped during a recent edit (unclosed tag, bad find-replace)
            - Token-safety guard removed or renamed in index.html
            - GitHub Pages deploy failed / page returned non-200
            - Page size dropped below 50 KB (blank page)

            Dashboard URL: https://smilehaus.github.io/rcm-dashboard/
