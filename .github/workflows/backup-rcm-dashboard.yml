name: RCM Dashboard — Auto Backup

# Saves an encrypted copy of the live board every 3 hours.
# The ciphertext is a workflow artifact, not a file in this public repo.
# Anyone with a GitHub token can download artifacts from a public repo,
# so the snapshot is AES-256 encrypted with BACKUP_ENCRYPTION_KEY.
# The key never leaves Actions secrets.

on:
  schedule:
    # Every 3 hours on the hour (UTC). Runs even if no one has the tab open.
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Require encryption key
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          if [ -z "$BACKUP_ENCRYPTION_KEY" ]; then
            echo "BACKUP_ENCRYPTION_KEY is not set. Refusing to store a roster snapshot in the clear."
            exit 1
          fi

      - name: Fetch and encrypt snapshot
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/backup"
          STAMP=$(date -u +%Y-%m-%d_%H-%M)
          PLAIN="$RUNNER_TEMP/backup/plain.json"
          ENC="$RUNNER_TEMP/backup/rcm-${STAMP}.json.enc"
          BASE="https://smilehaus-rcm-default-rtdb.firebaseio.com"

          fetch_fb() {
            local path="$1"
            if [ -n "${FIREBASE_DB_SECRET:-}" ]; then
              curl -sS -o "$PLAIN" -w "%{http_code}" --get "${BASE}/${path}" --data-urlencode "auth=${FIREBASE_DB_SECRET}"
            else
              curl -sS -o "$PLAIN" -w "%{http_code}" "${BASE}/${path}"
            fi
          }

          usable() {
            python3 -c 'import json,sys; raw=open(sys.argv[1],encoding="utf-8").read().strip();
          if not raw or raw=="null": sys.exit(2)
          try:
           data=json.loads(raw)
          except Exception:
           sys.exit(3)
          if not isinstance(data, dict) or "error" in data: sys.exit(3)
          if not data.get("staff") and not data.get("offices"): sys.exit(2)' "$PLAIN"
          }

          code=$(fetch_fb "board.json")
          if [ "$code" = "200" ] && usable; then
            echo "Using board.json"
          else
            code=$(fetch_fb "state.json")
            if [ "$code" != "200" ] || ! usable; then
              echo "Firebase read failed with HTTP ${code}. After the database rules are locked, set the FIREBASE_DB_SECRET secret."
              rm -f "$PLAIN"
              exit 1
            fi
            echo "Using state.json"
          fi

          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$PLAIN" -out "$ENC" -pass env:BACKUP_ENCRYPTION_KEY
          rm -f "$PLAIN"
          echo "Encrypted snapshot written (ciphertext only)."

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: rcm-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/backup/*.json.enc
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
