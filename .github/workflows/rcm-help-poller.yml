name: RCM Help — Error Auto-Fix

# Polls the RCM Help Queue in ClickUp every 30 minutes.
# For each open task, dispatches rcm-help.yml to process it.
# This workflow does NO git operations — all fixing happens in rcm-help.yml.

on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: none

jobs:
  poll:
    name: Fix RCM Dashboard Errors
    runs-on: ubuntu-latest
    steps:
      - name: Poll ClickUp and dispatch fixes
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          GITHUB_DISPATCH_TOKEN: ${{ secrets.GITHUB_DISPATCH_TOKEN }}
        run: |
          set -e

          echo "Polling RCM Help Queue (list 901417208736)..."

          # Pull open tasks — exclude closed/complete/needs-human
          RESPONSE=$(curl -s \
            -H "Authorization: $CLICKUP_API_TOKEN" \
            "https://api.clickup.com/api/v2/list/901417208736/task?include_closed=false&page=0")

          TASK_COUNT=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('tasks',[])))" 2>/dev/null || echo 0)
          echo "Found $TASK_COUNT open task(s)."

          if [ "$TASK_COUNT" -eq 0 ]; then
            echo "Nothing to process."
            exit 0
          fi

          # Iterate and dispatch rcm-help.yml for each task
          echo "$RESPONSE" | python3 - <<'PYEOF'
          import sys, json, os, urllib.request, urllib.error

          data = json.load(sys.stdin)
          tasks = data.get('tasks', [])

          token = os.environ['GITHUB_DISPATCH_TOKEN']
          repo  = 'smilehaus/rcm-dashboard'

          for task in tasks:
              task_id    = task.get('id', '')
              task_name  = task.get('name', 'Unknown')
              status     = (task.get('status') or {}).get('status', '')

              # Skip already-terminal tasks
              if status in ('complete', 'needs human', 'closed'):
                  print(f'  SKIP {task_id} ({status}): {task_name}')
                  continue

              print(f'  DISPATCH {task_id} ({status}): {task_name}')

              payload = json.dumps({
                  'ref': 'master',
                  'inputs': {
                      'task_id':    task_id,
                      'error_type': task_name,
                  }
              }).encode()

              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/workflows/rcm-help.yml/dispatches',
                  data=payload,
                  headers={
                      'Authorization':        f'Bearer {token}',
                      'Accept':               'application/vnd.github+json',
                      'Content-Type':         'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      print(f'    -> dispatched (HTTP {resp.status})')
              except urllib.error.HTTPError as e:
                  body = e.read().decode()
                  print(f'    -> ERROR {e.code}: {body}')
                  sys.exit(1)

          print('Done.')
          PYEOF
