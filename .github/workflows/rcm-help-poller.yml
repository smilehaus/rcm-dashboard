name: RCM Help — Error Auto-Fix

# Polls the RCM Help Queue in ClickUp every 30 minutes.
# For each open task, dispatches rcm-help.yml to process it.
# This workflow does NO git operations — all fixing happens in rcm-help.yml.

on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: none

jobs:
  poll:
    name: Fix RCM Dashboard Errors
    runs-on: ubuntu-latest
    steps:
      - name: Poll ClickUp and dispatch fixes
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          set -e

          echo "Polling RCM Help Queue (list 901417208736)..."

          RESPONSE=$(curl -s \
            -H "Authorization: $CLICKUP_API_TOKEN" \
            "https://api.clickup.com/api/v2/list/901417208736/task?include_closed=false&page=0")

          TASK_COUNT=$(echo "$RESPONSE" | jq '.tasks | length')
          echo "Found $TASK_COUNT open task(s)."

          if [ "$TASK_COUNT" -eq 0 ]; then
            echo "Nothing to process."
            exit 0
          fi

          # Iterate and dispatch rcm-help.yml for each open task
          echo "$RESPONSE" | jq -c '.tasks[]' | while read -r TASK; do
            TASK_ID=$(echo "$TASK" | jq -r '.id')
            TASK_NAME=$(echo "$TASK" | jq -r '.name')
            STATUS=$(echo "$TASK" | jq -r '.status.status // ""')

            # Skip already-terminal tasks
            if [[ "$STATUS" == "complete" || "$STATUS" == "needs human" || "$STATUS" == "closed" ]]; then
              echo "  SKIP $TASK_ID ($STATUS): $TASK_NAME"
              continue
            fi

            echo "  DISPATCH $TASK_ID ($STATUS): $TASK_NAME"

            # Escape the task name for JSON
            SAFE_NAME=$(echo "$TASK_NAME" | jq -Rs '.')

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $GH_DISPATCH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/smilehaus/rcm-dashboard/actions/workflows/rcm-help.yml/dispatches" \
              -d "{\"ref\":\"master\",\"inputs\":{\"task_id\":\"$TASK_ID\",\"error_type\":$SAFE_NAME}}")

            if [ "$HTTP_CODE" -eq 204 ]; then
              echo "    -> dispatched OK"
            else
              echo "    -> ERROR HTTP $HTTP_CODE (check GH_DISPATCH_TOKEN secret)"
              exit 1
            fi
          done

          echo "Done."
